<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GameWithUs – Community Page</title>
    <meta name="description" content="community page for final project WDD 231">
    <meta name="author" content="Luis Brasil Soares">
    <meta property="og:title" content="GameWithUs – Community Page">
    <meta property="og:description" content="This is the community page for GameWithUs' Final Project.">
    <meta property="og:image" content="https://luisebsoares.github.io/wdd231/images/profile.jpg">
    <meta property="og:url" content="https://luisebsoares.github.io/wdd231/">
    <link rel="stylesheet" href="styles/project.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Roboto:wght@400;700&display=swap"
        rel="stylesheet" />
    <script src="scripts/menu-toggle.js" defer></script>
    <script src="scripts/final.js" defer></script>
    <script src="scripts/explore.js" defer></script>
    <link rel="icon" href="images/favicon.ico">
</head>

<body>
    <header>
        <nav>
            <h1>GameWithUs</h1>
            <button id="menuToggle" class="menu-toggle" aria-label="Toggle navigation menu">&#9776;</button>
            <ul class="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="explore.html">Explore</a></li>
                <li><a href="community.html" class="active">Community</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1>Submit Your Game</h1>
        <p>Please fill in this form to submit your game to our community sharing platform.</p>

        <form action="submit-form.html" method="GET" novalidate id="gameSubmissionForm">
            <label for="creatorName">Creator Name *</label>
            <input type="text" id="creatorName" name="creatorName" required minlength="2" maxlength="50" />

            <label for="gameName">Game Name *</label>
            <input type="text" id="gameName" name="gameName" required minlength="1" maxlength="100" />

            <label for="gameDesc">Game Description *</label>
            <textarea id="gameDesc" name="gameDesc" required minlength="10" maxlength="1000"
                placeholder="Briefly describe your game..."></textarea>

            <label for="genre">Genre *</label>
            <select id="genre" name="genre" required>
                <option value="" disabled selected>Select a genre</option>
                <option>Action</option>
                <option>Adventure</option>
                <option>RPG</option>
                <option>Simulation</option>
                <option>Strategy</option>
                <option>Sports</option>
                <option>FPS</option>
                <option>Platformer</option>
                <option>Card Game</option>
                <option>Party</option>
                <option>Other</option>
            </select>

            <label for="releaseDate">Release Date (if known)</label>
            <input type="date" id="releaseDate" name="releaseDate" />

            <label for="contactEmail">Contact Email (optional)</label>
            <input type="email" id="contactEmail" name="contactEmail" placeholder="your.email@example.com" />

            <label for="website">Website or Store Link (optional)</label>
            <input type="url" id="website" name="website" placeholder="https://example.com" />

            <div class="checkbox-container">
                <input type="checkbox" id="terms" name="terms" required />
                <label for="terms">I agree to the <a href="terms.html" target="_blank" rel="noopener noreferrer">terms
                        and
                        conditions</a> *</label>
            </div>

            <button type="submit">Submit Game</button>
        </form>

        <script src="community.js"></script>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> Luis Brasil Soares – Cedar Hills, UT</p>
        <p id="lastModified"></p>
    </footer>
</body>

</html>
