<body>
    <header>
        <nav>
            <h1>GameWithUs</h1>
            <button id="menuToggle" class="menu-toggle" aria-label="Toggle navigation menu">&#9776;</button>
            <ul class="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="explore.html" class="active">Explore</a></li>
                <li><a href="community.html">Community</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>GameWithUs – Explore</h1>
        <section id="explore">
            <h2>Explore Games</h2>
            <div class="controls">
                <select id="genreFilter">
                    <option value="">All Genres</option>
                </select>
                <div class="view-toggle">
                    <button id="gridView" class="active">Grid</button>
                    <button id="listView">List</button>
                </div>
            </div>
            <div id="gameList" class="game-cards grid">
            </div>
        </section>

        <dialog id="gameModal">
            <h2 id="modalTitle"></h2>
            <p id="modalDesc"></p>
            <button id="closeModal" class="close-btn">Close</button>
        </dialog>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> Luis Brasil Soares – Cedar Hills, UT</p>
        <p id="lastModified"></p>
